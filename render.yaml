services:
  - type: web
    name: blueprint-cli-test
    runtime: python
    plan: free
    region: oregon
    buildCommand: "true"
    startCommand: python app.py
    healthCheckPath: /
    envVars:
      - key: GREETING
        value: hi from a planned sync
      - key: APP_VERSION
        value: "2"
      - key: SECRET_TOKEN
        sync: false
